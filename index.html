<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ABBA Biblia de Estudio</title>
    
    <!-- PWA Configuración -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1A1614">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Academia ABBA">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
              display: ['Cinzel', 'serif'],
            },
            colors: {
              bible: {
                paper: '#FDFBF7',
                ink: '#1A1614',
                gold: '#D4AF37',
                yellow: '#FFD700',
                leather: '#4E342E',
                accent: '#B8860B',
                dark: '#0A0A0A',
                modern: {
                  bg: '#F8F9FA',
                  primary: '#2D3436',
                  accent: '#6C5CE7'
                }
              }
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.2)',
              'soft': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
              'gold': '0 10px 25px -5px rgba(212, 175, 55, 0.2)'
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #FDFBF7;
        color: #1A1614;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .selectable-text {
        user-select: text !important;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        background: #FDFBF7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .book-logo {
        width: 80px;
        height: 60px;
        background: #D4AF37;
        position: relative;
        border-radius: 4px 10px 10px 4px;
        box-shadow: 10px 10px 20px rgba(0,0,0,0.1);
        margin-bottom: 2rem;
      }
      .book-logo::after {
        content: '';
        position: absolute;
        left: 8px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(0,0,0,0.1);
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.5); }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@18.3.1",
    "react-dom/client": "https://aistudiocdn.com/react-dom@18.3.1/client",
    "react-dom": "https://aistudiocdn.com/react-dom@18.3.1",
    "react/jsx-runtime": "https://aistudiocdn.com/react@18.3.1/jsx-runtime",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-loader">
       <div class="book-logo animate-pulse"></div>
       <p class="font-display font-bold text-bible-gold tracking-[0.4em] uppercase text-xs">Academia ABBA</p>
       <p class="text-stone-500 text-[10px] uppercase font-bold tracking-widest mt-4">Iniciando Biblioteca Teológica</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
        }, 1200);
      });
    </script>
  </body>
</html>
